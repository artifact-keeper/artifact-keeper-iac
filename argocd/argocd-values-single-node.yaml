# ArgoCD Helm values for single-node K8s clusters (dev/test)
# Install: helm install argocd argo/argo-cd -n argocd --create-namespace -f argocd-values-single-node.yaml

server:
  replicas: 1
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

controller:
  replicas: 1
  # The application controller keeps an in-memory cache of every resource
  # in the clusters it manages, so its footprint grows with the cluster, not
  # with the number of Applications. At a 512Mi limit it was OOM-killed in a
  # loop (thousands of restarts, apps stuck OutOfSync) on a single node that
  # also runs CI workloads: its working set reached the limit within ~11
  # minutes of every start. 2Gi leaves room to measure the real steady state;
  # lower it once `container_memory_working_set_bytes` for the pod has a week
  # of history below ~1.2Gi.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 2Gi

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

applicationSet:
  replicas: 1

notifications:
  enabled: false

configs:
  params:
    server.insecure: true
  repositories:
    artifact-keeper-iac:
      url: https://github.com/artifact-keeper/artifact-keeper-iac.git
      name: artifact-keeper-iac
      type: git
