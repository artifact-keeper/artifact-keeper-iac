# CI test values for chart-testing (ct install) in kind clusters.
# Disables heavy components and uses minimal resources so the chart
# can be installed in a resource-constrained environment.

# Exercise the egress-proxy templating: global.proxy flows into the egress
# components (backend here), while web keeps its default proxy.enabled: false.
# A dead proxy is install-safe: NO_PROXY auto-includes the in-cluster Services
# and the DB, and /readyz only checks DB+migrations, so pods still go Ready.
global:
  proxy:
    httpProxy: "http://proxy.ci.invalid:3128"
    httpsProxy: "http://proxy.ci.invalid:3128"
    noProxy: ".ci.invalid,.example.com"

backend:
  # Throwaway test credentials in backend.env; acknowledged so the render's
  # credential check (#375) passes. Never copy this into a real install.
  allowCredentialsInEnv: true
  replicaCount: 1
  image:
    tag: dev
    pullPolicy: IfNotPresent
  # Override the default ADMIN_PASSWORD ("admin" from values.yaml) so the
  # backend does not detect a default-password install and lock its /readyz
  # endpoint. Without this, chart-testing's helm --wait times out because
  # the pod never becomes Ready (startup probe against /readyz returns 503
  # for as long as the admin lock is active).
  env:
    ADMIN_PASSWORD: "CI-test-password-not-for-prod"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  persistence:
    enabled: true
    size: 1Gi
  scanWorkspace:
    enabled: false
  autoscaling:
    enabled: false
  podDisruptionBudget:
    enabled: false

# Actually RUN a worker: its failure mode is "the pod does not start", which
# only an install catches. k3d's local-path PVs are node-affine, so co-location
# is safe here.
scanWorker:
  enabled: true
  replicaCount: 1
  colocateWithBackend: true
  concurrency: 1
  scanWorkspaceSizeLimit: 1Gi
  env: {}
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

web:
  enabled: true
  replicaCount: 1
  image:
    tag: dev
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
      ephemeral-storage: 512Mi

edge:
  enabled: false

postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
  auth:
    username: registry
    # password and secrets.jwtSecret are left unset so ct install exercises the
    # generated-credentials path end to end.
    database: artifact_registry
  persistence:
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  initDb:
    enabled: true

opensearch:
  enabled: false

trivy:
  enabled: false

dependencyTrack:
  enabled: false

ingress:
  enabled: false

cosign:
  enabled: false

networkPolicy:
  enabled: false

serviceMonitor:
  enabled: false

externalSecrets:
  enabled: false

secrets:
  s3AccessKey: "ci-test-access"
  s3SecretKey: "ci-test-secret"
