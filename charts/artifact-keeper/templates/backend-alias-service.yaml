{{/*
=============================================================================
Backend DNS Alias
=============================================================================
Web images before 1.1.0 baked BACKEND_URL into their Next.js rewrites at build
time (Dockerfile default: http://backend:8080). This ExternalName service
creates a bare "backend" DNS alias in the release namespace so that baked-in
hostname resolves to the Helm-named backend service regardless of the release
name.

Web 1.1.0 and later (artifact-keeper-web #58) proxy the API from middleware
that reads BACKEND_URL at runtime, and web-deployment.yaml always sets it to
the release-qualified backend Service, so the chart's default web image does
not need this alias. It claims the literal name "backend" in the namespace,
which collides with any other Service of that name (shared namespaces, several
releases in one namespace). Set web.backendAlias.enabled=false there.
=============================================================================
*/}}
{{- if and .Values.backend.enabled .Values.web.enabled (eq (include "artifact-keeper.backendAlias.enabled" .) "true") }}
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "artifact-keeper.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend-alias
spec:
  type: ExternalName
  externalName: {{ include "artifact-keeper.fullname" . }}-backend.{{ .Release.Namespace }}.svc.cluster.local
{{- end }}
