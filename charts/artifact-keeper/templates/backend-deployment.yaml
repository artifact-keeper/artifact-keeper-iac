{{/*
=============================================================================
EXAMPLE CONFIGURATION - Getting Started Template
=============================================================================
This file is provided as a starting point for deployments. It should be
reviewed and modified to match your specific infrastructure requirements,
security policies, and operational needs before use in production.
=============================================================================
*/}}
{{- if .Values.backend.enabled }}
{{- include "artifact-keeper.validateBackendEnvCredentials" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "artifact-keeper.fullname" . }}-backend
  labels:
    {{- include "artifact-keeper.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  {{- with .Values.backend.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ include "artifact-keeper.backend.replicaCount" . }}
  {{- end }}
  strategy:
    {{- include "artifact-keeper.deploymentStrategy" (dict "strategy" .Values.backend.strategy "path" "backend.strategy") | nindent 4 }}
  selector:
    matchLabels:
      {{- include "artifact-keeper.backend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "artifact-keeper.backend.selectorLabels" . | nindent 8 }}
        {{- range $key, $value := .Values.backend.podLabels }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
      {{- with .Values.backend.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with (.Values.backend.tolerations | default .Values.global.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (.Values.backend.affinity | default .Values.global.affinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (.Values.backend.nodeSelector | default .Values.global.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (.Values.backend.topologySpreadConstraints | default .Values.global.topologySpreadConstraints) }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "artifact-keeper.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.backend.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- if .Values.cosign.enabled }}
        - name: verify-image-signature
          image: {{ include "artifact-keeper.image" (dict "image" .Values.cosign.image "context" .) | quote }}
          command: ["cosign", "verify",
            "--certificate-oidc-issuer={{ .Values.cosign.certificateOidcIssuer }}",
            "--certificate-identity-regexp={{ .Values.cosign.certificateIdentityRegexp }}",
            {{ include "artifact-keeper.image" (dict "image" .Values.backend.image "defaultTag" .Chart.AppVersion "context" .) | quote }}]
          {{- /* cosign reaches Rekor/Fulcio and the registry, so behind a
                 proxy-only egress it needs the backend's proxy settings. */}}
          {{- with (include "artifact-keeper.proxyEnv" (dict "proxy" .Values.backend.proxy "ctx" $)) }}
          env:
            {{- . | trim | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.initContainerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 100m
              memory: 64Mi
              ephemeral-storage: 128Mi
        {{- end }}
        {{- if .Values.postgres.enabled }}
        - name: wait-for-postgres
          image: {{ include "artifact-keeper.image" (dict "image" .Values.postgres.image "context" .) | quote }}
          {{- with .Values.backend.initContainerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
              ephemeral-storage: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
              ephemeral-storage: 64Mi
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Waiting for PostgreSQL..."
              until pg_isready -h {{ include "artifact-keeper.fullname" . }}-postgres -p 5432 -U {{ .Values.postgres.auth.username }}; do
                sleep 3
              done
              echo "PostgreSQL is ready"
        {{- end }}
        {{- if .Values.opensearch.enabled }}
        - name: wait-for-opensearch
          image: {{ include "artifact-keeper.image" (dict "image" .Values.backend.waitForOpenSearch.image "context" .) | quote }}
          {{- with .Values.backend.initContainerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
              ephemeral-storage: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
              ephemeral-storage: 64Mi
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Waiting for OpenSearch..."
              # Accept green or yellow cluster status. When security is enabled
              # the probe talks to HTTPS with -k; otherwise plain HTTP.
              {{- if .Values.opensearch.disableSecurityPlugin }}
              URL="http://{{ include "artifact-keeper.fullname" . }}-opensearch:9200/_cluster/health"
              CURL_ARGS=""
              {{- else }}
              URL="https://{{ include "artifact-keeper.fullname" . }}-opensearch:9200/_cluster/health"
              CURL_ARGS="-k"
              {{- end }}
              # BOUNDED wait. OpenSearch is an OPTIONAL search accelerator: the
              # backend boots and runs on Postgres-native search when it is
              # unavailable (main.rs: "continuing without search" -> search_service
              # = None; the reindex is backgrounded). An UNBOUNDED wait here made a
              # slow/degraded OpenSearch block the backend in PodInitializing until
              # the rollout timeout, which cascaded a whole release-gate failure
              # (the v1.6.0 gate). After waitTimeoutSeconds we PROCEED so the
              # backend can serve on the Postgres fallback and pick OpenSearch back
              # up when it recovers. Set opensearch.waitTimeoutSeconds=0 to restore
              # the old wait-forever behavior.
              {{- /* dig (not `default`) so an explicit 0 is honored: Go
                     templates treat 0 as empty, so `0 | default 180` would
                     wrongly render 180 and the wait-forever escape hatch would
                     never work. */}}
              WAIT_TIMEOUT={{ dig "waitTimeoutSeconds" 180 .Values.opensearch }}
              DEADLINE=$(( $(date +%s) + WAIT_TIMEOUT ))
              until wget -qO- $URL 2>/dev/null | grep -q '"status":"\(green\|yellow\)"'; do
                if [ "$WAIT_TIMEOUT" -gt 0 ] && [ "$(date +%s)" -ge "$DEADLINE" ]; then
                  echo "WARNING: OpenSearch not ready after ${WAIT_TIMEOUT}s; proceeding. The backend will serve on Postgres-native search until OpenSearch recovers."
                  exit 0
                fi
                sleep 3
              done
              echo "OpenSearch is ready"
        {{- end }}
      containers:
        - name: backend
          image: {{ include "artifact-keeper.image" (dict "image" .Values.backend.image "defaultTag" .Chart.AppVersion "context" .) | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          {{- with .Values.backend.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.httpPort }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.backend.service.grpcPort }}
              protocol: TCP
            {{- if .Values.backend.metricsListener.enabled }}
            - name: metrics
              containerPort: {{ .Values.backend.metricsListener.port }}
              protocol: TCP
            {{- end }}
          {{- with .Values.backend.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:{{- include "artifact-keeper.backend.env" . }}
            {{- if .Values.scanWorker.enabled }}
            # Scans become durable queue jobs, drained by the scan-worker
            # Deployment, so grype never execs on an API pod.
            - name: SCAN_QUEUE_ENABLED
              value: "true"
            - name: SCAN_WORKER_ENABLED
              value: "false"
            {{- end }}
          resources:
            {{- include "artifact-keeper.backend.resources" . | nindent 12 }}
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: storage
              mountPath: /data/storage
              subPath: storage
            - name: storage
              mountPath: /data/backups
              subPath: backups
            - name: storage
              mountPath: /data/plugins
              subPath: plugins
            {{- if or .Values.backend.scanWorkspace.enabled .Values.trivy.enabled }}
            - name: scan-workspace
              mountPath: /scan-workspace
            {{- end }}
            {{- if eq (include "artifact-keeper.dtrackApiKeyFile" .) "true" }}
            - name: shared-config
              mountPath: /shared
              readOnly: true
            {{- end }}
            {{- with .Values.backend.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: storage
          {{- if .Values.backend.persistence.enabled }}
          {{- if .Values.backend.persistence.ephemeral.enabled }}
          {{- fail "backend.persistence.enabled and backend.persistence.ephemeral.enabled cannot both be true" }}
          {{- end }}
          persistentVolumeClaim:
            claimName: {{ .Values.backend.persistence.existingClaim | default (printf "%s-storage" (include "artifact-keeper.fullname" .)) }}
          {{- else if .Values.backend.persistence.ephemeral.enabled }}
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes:
                  {{- toYaml .Values.backend.persistence.ephemeral.accessModes | nindent 18 }}
                resources:
                  requests:
                    storage: {{ .Values.backend.persistence.ephemeral.size }}
                {{- with .Values.backend.persistence.ephemeral.storageClass }}
                storageClassName: {{ . | quote }}
                {{- end }}
          {{- else }}
          emptyDir:
            sizeLimit: {{ .Values.backend.persistence.emptyDir.sizeLimit }}
          {{- end }}
        {{- if or .Values.backend.scanWorkspace.enabled .Values.trivy.enabled }}
        - name: scan-workspace
          {{- if .Values.backend.scanWorkspace.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.backend.scanWorkspace.existingClaim | default (printf "%s-scan-workspace" (include "artifact-keeper.fullname" .)) }}
          {{- else }}
          {{- /* Trivy is enabled, so SCAN_WORKSPACE_PATH=/scan-workspace is in
                 the env above, but no PVC was requested. The container root
                 filesystem is read-only, so without a volume here every scan
                 fails on EROFS. Give each pod its own scratch dir instead --
                 the workspace only holds per-scan temp files, and per-pod
                 scratch is what lets the backend run more than one replica
                 (an RWO PVC pins every replica to one node). */}}
          emptyDir:
            sizeLimit: {{ .Values.backend.scanWorkspace.size }}
          {{- end }}
        {{- end }}
        {{- if eq (include "artifact-keeper.dtrackApiKeyFile" .) "true" }}
        - name: shared-config
          persistentVolumeClaim:
            claimName: {{ include "artifact-keeper.sharedConfigClaimName" . }}
        {{- end }}
        {{- with .Values.backend.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
