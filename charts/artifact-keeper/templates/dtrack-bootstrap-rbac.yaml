{{- if .Values.dependencyTrack.enabled }}
{{- $manage := dig "bootstrap" "manageApiKeySecret" false .Values.dependencyTrack }}
{{- if not (kindIs "bool" $manage) }}
{{- fail "dependencyTrack.bootstrap.manageApiKeySecret must be a boolean" }}
{{- end }}
{{- if $manage }}
{{- if not .Values.dependencyTrack.bootstrap.enabled }}
{{- fail "dependencyTrack.bootstrap.manageApiKeySecret requires bootstrap.enabled=true" }}
{{- end }}
{{- $name := .Values.dependencyTrack.existingApiKeySecret }}
{{- if or (not $name) (gt (len $name) 253) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$" $name)) }}
{{- fail "dependencyTrack.bootstrap.manageApiKeySecret requires a valid existingApiKeySecret name" }}
{{- end }}
{{- if ne .Values.dependencyTrack.existingApiKeySecretKey "API_KEY" }}
{{- fail "dependencyTrack.bootstrap.manageApiKeySecret requires existingApiKeySecretKey=API_KEY" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "artifact-keeper.fullname" . }}-dtrack-bootstrap
  labels:
    {{- include "artifact-keeper.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "artifact-keeper.fullname" . }}-dtrack-bootstrap
  labels:
    {{- include "artifact-keeper.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  # Kubernetes RBAC cannot restrict top-level creation by resourceNames.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $name | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "artifact-keeper.fullname" . }}-dtrack-bootstrap
  labels:
    {{- include "artifact-keeper.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
subjects:
  - kind: ServiceAccount
    name: {{ include "artifact-keeper.fullname" . }}-dtrack-bootstrap
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "artifact-keeper.fullname" . }}-dtrack-bootstrap
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
