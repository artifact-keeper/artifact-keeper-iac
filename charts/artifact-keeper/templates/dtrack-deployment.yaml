{{/*
=============================================================================
EXAMPLE CONFIGURATION - Getting Started Template
=============================================================================
This file is provided as a starting point for deployments. It should be
reviewed and modified to match your specific infrastructure requirements,
security policies, and operational needs before use in production.
=============================================================================
*/}}
{{- if .Values.dependencyTrack.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "artifact-keeper.fullname" . }}-dtrack
  labels:
    {{- include "artifact-keeper.labels" . | nindent 4 }}
    app.kubernetes.io/component: dependency-track
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "artifact-keeper.dtrack.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "artifact-keeper.dtrack.selectorLabels" . | nindent 8 }}
    spec:
      {{- with (.Values.dependencyTrack.tolerations | default .Values.global.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (.Values.dependencyTrack.affinity | default .Values.global.affinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (.Values.dependencyTrack.nodeSelector | default .Values.global.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (.Values.dependencyTrack.topologySpreadConstraints | default .Values.global.topologySpreadConstraints) }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      {{- with .Values.dependencyTrack.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.postgres.enabled }}
      initContainers:
        - name: wait-for-postgres
          image: {{ include "artifact-keeper.image" (dict "image" .Values.postgres.image "context" .) | quote }}
          {{- with .Values.dependencyTrack.initContainerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
              ephemeral-storage: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
              ephemeral-storage: 64Mi
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Waiting for PostgreSQL..."
              until pg_isready -h {{ include "artifact-keeper.fullname" . }}-postgres -p 5432 -U {{ .Values.postgres.auth.username }}; do
                sleep 3
              done
              echo "PostgreSQL is ready"
      {{- end }}
      containers:
        - name: dtrack-api
          image: {{ include "artifact-keeper.image" (dict "image" .Values.dependencyTrack.image "context" .) | quote }}
          imagePullPolicy: IfNotPresent
          {{- with .Values.dependencyTrack.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            {{- $dbHostFromSecret := eq (include "artifact-keeper.dtrackDbHostFromExistingSecret" .) "true" }}
            {{- if $dbHostFromSecret }}
            # Project host/port out of the operator-provided Secret so the JDBC
            # URL below can reference them via $(VAR) expansion. Kubernetes
            # expands env vars in declared order, so these MUST come before
            # ALPINE_DATABASE_URL.
            - name: _DTRACK_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalDatabase.existingSecret }}
                  key: {{ .Values.externalDatabase.existingHostKey | default "POSTGRES_HOST" }}
            - name: _DTRACK_DB_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalDatabase.existingSecret }}
                  key: {{ .Values.externalDatabase.existingPortKey | default "POSTGRES_PORT" }}
            {{- end }}
            - name: ALPINE_DATABASE_MODE
              value: "external"
            - name: ALPINE_DATABASE_URL
              {{- if .Values.postgres.enabled }}
              value: "jdbc:postgresql://{{ include "artifact-keeper.fullname" . }}-postgres:5432/{{ include "artifact-keeper.dtrackDatabase" . }}"
              {{- else if $dbHostFromSecret }}
              value: "jdbc:postgresql://$(_DTRACK_DB_HOST):$(_DTRACK_DB_PORT)/{{ include "artifact-keeper.dtrackDatabase" . }}"
              {{- else }}
              value: "jdbc:postgresql://{{ .Values.externalDatabase.host }}:{{ .Values.externalDatabase.port }}/{{ include "artifact-keeper.dtrackDatabase" . }}"
              {{- end }}
            - name: ALPINE_DATABASE_DRIVER
              value: "org.postgresql.Driver"
            - name: ALPINE_DATABASE_USERNAME
              {{- if .Values.postgres.enabled }}
              value: {{ .Values.postgres.auth.username | quote }}
              {{- else }}
              value: {{ .Values.externalDatabase.username | quote }}
              {{- end }}
            - name: ALPINE_DATABASE_PASSWORD
              {{- if eq (include "artifact-keeper.dtrackDbPasswordFromExistingSecret" .) "true" }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalDatabase.existingSecret }}
                  key: {{ .Values.externalDatabase.existingPasswordKey | default "POSTGRES_PASSWORD" }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "artifact-keeper.secretName" . }}
                  key: POSTGRES_PASSWORD
              {{- end }}
            - name: ALPINE_DATA_DIRECTORY
              value: "/data"
            - name: ALPINE_ENFORCE_AUTHENTICATION
              value: "true"
            # CORS is only relevant when the Dependency-Track UI/API is exposed
            # on the public ingress (ingress.dtrack.enabled). In-cluster access
            # (backend -> service, kubectl port-forward) is same-origin and
            # needs no CORS, so it stays disabled otherwise.
            {{- if .Values.ingress.dtrack.enabled }}
            - name: ALPINE_CORS_ENABLED
              value: "true"
            - name: ALPINE_CORS_ALLOW_ORIGIN
              value: {{ .Values.ingress.dtrack.corsAllowOrigin | quote }}
            {{- else }}
            - name: ALPINE_CORS_ENABLED
              value: "false"
            {{- end }}
            - name: JAVA_OPTIONS
              value: "-Xmx4g"
          resources:
            {{- toYaml .Values.dependencyTrack.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["wget", "-q", "--spider", "http://localhost:8080/api/version"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["wget", "-q", "--spider", "http://localhost:8080/api/version"]
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - name: dtrack-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            # DependencyTrack writes ~1-2Gi into /tmp during startup (NVD
            # mirror sync, DB migrations, JVM working files). A 256Mi
            # ceiling triggers `Usage of EmptyDir volume "tmp" exceeds the
            # limit` evictions partway through init, producing a tight
            # crash-loop. 2Gi default fits stock startup; operators on
            # constrained nodes can tune down via dependencyTrack.tmpSizeLimit.
            sizeLimit: {{ .Values.dependencyTrack.tmpSizeLimit | default "2Gi" }}
        - name: dtrack-data
          persistentVolumeClaim:
            claimName: {{ include "artifact-keeper.fullname" . }}-dtrack
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "artifact-keeper.fullname" . }}-dtrack
  labels:
    {{- include "artifact-keeper.labels" . | nindent 4 }}
    app.kubernetes.io/component: dependency-track
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.dependencyTrack.persistence.size }}
  {{- if .Values.dependencyTrack.persistence.storageClass }}
  storageClassName: {{ .Values.dependencyTrack.persistence.storageClass | quote }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "artifact-keeper.fullname" . }}-dtrack
  labels:
    {{- include "artifact-keeper.labels" . | nindent 4 }}
    app.kubernetes.io/component: dependency-track
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    {{- include "artifact-keeper.dtrack.selectorLabels" . | nindent 4 }}
---
{{- if .Values.dependencyTrack.bootstrap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "artifact-keeper.fullname" . }}-dtrack-init
  labels:
    {{- include "artifact-keeper.labels" . | nindent 4 }}
    app.kubernetes.io/component: dependency-track
data:
  init-dtrack.sh: |
    #!/bin/sh
    # Bootstrap Dependency-Track: change the default admin password, then
    # generate an API key for the Automation team and write it onto a shared
    # volume for the backend. Optionally enables NVD API mirroring.
    #
    # With dependencyTrack.existingApiKeySecret set there is no key to read and
    # no volume to write it to, so DEPENDENCY_TRACK_API_KEY_FILE is unset and
    # this Job reconciles the admin password (and, when
    # dependencyTrack.bootstrap.nvdApiEnabled is true, the NVD property) only.
    #
    # Deliberately depends on curl only. An earlier version ran
    # "apk add --no-cache curl jq" here, which failed on every cluster (the pod
    # runs as non-root and apk needs root) and additionally on any cluster
    # without egress to the Alpine CDN. The failure was swallowed, so the
    # symptom was a five-minute wait loop and a Job that timed out with no
    # useful message. See iac issue 202.
    set -eu

    DT_URL="${DEPENDENCY_TRACK_URL:-http://{{ include "artifact-keeper.fullname" . }}-dtrack:8080}"
    DT_ADMIN_USER="admin"
    DT_DEFAULT_PASS="admin"
    DT_NEW_PASS="${DEPENDENCY_TRACK_ADMIN_PASSWORD:-}"
    # Empty when the key is supplied through dependencyTrack.existingApiKeySecret.
    API_KEY_FILE="${DEPENDENCY_TRACK_API_KEY_FILE:-}"
    NVD_API_ENABLED="${NVD_API_ENABLED:-false}"

    fail() {
      echo "[dtrack-init] ERROR: $1" >&2
      exit 1
    }

    # Fail before touching the API rather than sending an empty password to
    # forceChangePassword, which Dependency-Track rejects with 406.
    if [ -z "$DT_NEW_PASS" ]; then
      fail "DEPENDENCY_TRACK_ADMIN_PASSWORD is empty. The chart generates one when dependencyTrack.adminPassword is unset; an empty value here means the Secret was supplied externally without this key."
    fi

    # Generate a key only when a key file is wanted and not yet written. With
    # existingApiKeySecret there is no key file, so no key is ever generated.
    NEED_KEY=false
    if [ -n "$API_KEY_FILE" ]; then
      if [ -f "$API_KEY_FILE" ] && [ -s "$API_KEY_FILE" ]; then
        if [ "$NVD_API_ENABLED" != "true" ]; then
          echo "[dtrack-init] API key already provisioned, nothing to do"
          exit 0
        fi
        # Keep going only to apply dependencyTrack.bootstrap.nvdApiEnabled, so
        # turning it on for an existing install takes effect on the next upgrade.
        echo "[dtrack-init] API key already provisioned; applying NVD setting only"
      else
        NEED_KEY=true
      fi
    fi

    echo "[dtrack-init] Waiting for Dependency-Track at $DT_URL"
    i=1
    while [ "$i" -le 60 ]; do
      if curl -sf -o /dev/null "$DT_URL/api/version"; then
        echo "[dtrack-init] Dependency-Track is up after $((i * 5))s"
        break
      fi
      if [ "$i" -eq 60 ]; then
        # Report what curl actually said. A silent timeout here was the single
        # most confusing symptom of issue 202.
        echo "[dtrack-init] last attempt output:" >&2
        curl -sS -o /dev/null "$DT_URL/api/version" >&2 || true
        fail "Dependency-Track did not become ready at $DT_URL within 300s"
      fi
      i=$((i + 1))
      sleep 5
    done

    # --data-urlencode, not -d: a generated password is alphanumeric, but an
    # operator-supplied dependencyTrack.adminPassword may contain characters
    # ('&', '=', '+', '%') that raw form bodies would misparse as field
    # separators or decode, silently breaking auth.
    login() {
      curl -sf -X POST "$DT_URL/api/v1/user/login" \
        --data-urlencode "username=${DT_ADMIN_USER}" \
        --data-urlencode "password=$1" || true
    }

    TOKEN=$(login "$DT_NEW_PASS")

    if [ -z "$TOKEN" ]; then
      echo "[dtrack-init] Admin password not yet changed, performing first-run change"
      curl -sS -f -o /dev/null -X POST "$DT_URL/api/v1/user/forceChangePassword" \
        --data-urlencode "username=${DT_ADMIN_USER}" \
        --data-urlencode "password=${DT_DEFAULT_PASS}" \
        --data-urlencode "newPassword=${DT_NEW_PASS}" \
        --data-urlencode "confirmPassword=${DT_NEW_PASS}" \
        || fail "forceChangePassword failed. If this deployment previously bootstrapped with a different password, the admin password no longer matches the Secret and must be reconciled by hand. See the chart README, section 'Recovering a Dependency-Track password mismatch'."
      TOKEN=$(login "$DT_NEW_PASS")
    fi

    [ -n "$TOKEN" ] || fail "authentication failed after password change"

    if [ -z "$API_KEY_FILE" ]; then
      echo "[dtrack-init] API key supplied through dependencyTrack.existingApiKeySecret; admin password reconciled, no key to generate"
    fi

    if [ "$NEED_KEY" = "true" ]; then
      TEAMS=$(curl -sS -f "$DT_URL/api/v1/team" -H "Authorization: Bearer $TOKEN") \
        || fail "could not list teams"

      # Find the Automation team's UUID without jq. /api/v1/team returns a
      # JSON array of team objects; put each object on its own line so the
      # match cannot run across a team boundary, keep only the Automation
      # line, then take the UUID that now starts it.
      AUTOMATION=$(printf '%s' "$TEAMS" | sed 's/{"uuid"/\
    {"uuid"/g' | grep '"name":"Automation"' | head -n 1)

      [ -n "$AUTOMATION" ] || fail "no Automation team found in Dependency-Track. Expected the default team created on first run."

      TEAM_UUID=$(printf '%s' "$AUTOMATION" \
        | sed -n 's/^{"uuid":"\([0-9A-Fa-f-]\{36\}\)".*/\1/p')
      case "$TEAM_UUID" in
        "") fail "could not extract the Automation team UUID. The Dependency-Track response shape may have changed." ;;
        *[!0-9A-Fa-f-]*) fail "extracted team UUID contains unexpected characters" ;;
      esac

      # Generate a new key rather than reading one back from the team
      # listing: from 4.13 Dependency-Track hashes API keys and the listing
      # only carries a masked form. PUT /api/v1/team/{uuid}/key is the
      # generate call on every 4.x release (201 with the plaintext key in the
      # body, the only time it is returned); POST only regenerates an
      # existing key. Each successful run adds one key to the team; the early
      # exit above keeps that to once per shared volume.
      echo "[dtrack-init] Generating an API key for the Automation team"
      KEY_RESP=$(curl -sS -f -X PUT "$DT_URL/api/v1/team/$TEAM_UUID/key" \
        -H "Authorization: Bearer $TOKEN" \
        -H "Content-Type: application/json") \
        || fail "PUT /api/v1/team/$TEAM_UUID/key failed"

      # Match "key" exactly; the response also carries "maskedKey" and, on
      # 4.13+, "publicId".
      API_KEY=$(printf '%s' "$KEY_RESP" \
        | sed -n 's/.*"key":"\([A-Za-z0-9_-]\{16,\}\)".*/\1/p' \
        | head -n 1)

      # Validate rather than trust the parse. A malformed extraction fails the
      # deploy loudly instead of writing a bad key that surfaces later as
      # confusing 401s from the backend.
      case "$API_KEY" in
        "") fail "could not extract an API key from the key-generation response. The Dependency-Track response shape may have changed; set dependencyTrack.enabled=false and configure DEPENDENCY_TRACK_API_KEY directly if this persists." ;;
        *[!A-Za-z0-9_-]*) fail "extracted API key contains unexpected characters, refusing to write it" ;;
      esac

      # umask 077 keeps the key from being world-readable on the shared PVC.
      # The backend pod runs as a different UID (1001, fsGroup 0) than this Job
      # (1000/1000); it can read the 0600 file because the kubelet re-applies
      # fsGroup ownership on volume mount (fsGroupChangePolicy defaults to
      # Always). If you override fsGroupChangePolicy to OnRootMismatch on the
      # backend pod, verify it can still read this file.
      #
      # Write to a temp file and rename: the key cannot be read back from
      # Dependency-Track, and a truncated file would pass the non-empty check
      # above on the next run and never be replaced.
      umask 077
      printf '%s\n' "$API_KEY" > "$API_KEY_FILE.tmp"
      mv "$API_KEY_FILE.tmp" "$API_KEY_FILE"
      echo "[dtrack-init] API key written to $API_KEY_FILE"
    fi

    # Opt-in (dependencyTrack.bootstrap.nvdApiEnabled): switch NVD mirroring
    # to the NVD REST API 2.0. Off by default because, without an NVD API key
    # (set in the Dependency-Track UI), the API is heavily rate-limited, and
    # because changing the vulnerability source on an existing install is a
    # behaviour change. When off, the property is left untouched. A failure
    # only warns: Dependency-Track answers 404 for an unknown property.
    if [ "$NVD_API_ENABLED" = "true" ]; then
      echo "[dtrack-init] Enabling NVD API mirroring (vuln-source/nvd.api.enabled)"
      NVD_HTTP=$(curl -s -o /dev/null -w '%{http_code}' \
        -X POST "$DT_URL/api/v1/configProperty" \
        -H "Authorization: Bearer $TOKEN" \
        -H "Content-Type: application/json" \
        -d '{"groupName":"vuln-source","propertyName":"nvd.api.enabled","propertyValue":"true"}' || true)
      if [ "$NVD_HTTP" != "200" ]; then
        echo "[dtrack-init] WARNING: setting nvd.api.enabled returned HTTP $NVD_HTTP" >&2
      fi
    fi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "artifact-keeper.fullname" . }}-dtrack-init
  labels:
    {{- include "artifact-keeper.labels" . | nindent 4 }}
    app.kubernetes.io/component: dependency-track
  annotations:
    # Run as a hook, not a chart-managed resource. A Job's pod template is
    # immutable, so a plain Job breaks every "helm upgrade" that touches its
    # spec with a "field is immutable" error until someone deletes the old Job
    # by hand. before-hook-creation deletes the previous Job before each run
    # (same pattern as fleet-db-bootstrap-job.yaml). post-install/post-upgrade
    # rather than pre-*: the Job needs the Dependency-Track Deployment, the
    # Secret, and the script ConfigMap to exist first. The script exits 0
    # immediately when the API key is already provisioned, so re-running on
    # every upgrade is cheap.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "artifact-keeper.dtrack.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (.Values.dependencyTrack.tolerations | default .Values.global.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (.Values.dependencyTrack.affinity | default .Values.global.affinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (.Values.dependencyTrack.nodeSelector | default .Values.global.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (.Values.dependencyTrack.topologySpreadConstraints | default .Values.global.topologySpreadConstraints) }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dependencyTrack.bootstrap.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: dtrack-init
          # An image that already carries curl. The script installs nothing at
          # runtime, so this works on clusters with no egress to a package
          # mirror. Override dependencyTrack.bootstrap.image to point at your
          # own registry in an air-gapped environment.
          image: {{ include "artifact-keeper.image" (dict "image" .Values.dependencyTrack.bootstrap.image "context" .) | quote }}
          imagePullPolicy: {{ .Values.dependencyTrack.bootstrap.image.pullPolicy | default "IfNotPresent" }}
          {{- with .Values.dependencyTrack.bootstrap.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
              ephemeral-storage: 128Mi
          command: ["/bin/sh", "/scripts/init-dtrack.sh"]
          env:
            - name: DEPENDENCY_TRACK_URL
              value: "http://{{ include "artifact-keeper.fullname" . }}-dtrack:8080"
            - name: NVD_API_ENABLED
              value: {{ .Values.dependencyTrack.bootstrap.nvdApiEnabled | toString | quote }}
            - name: DEPENDENCY_TRACK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "artifact-keeper.secretName" . }}
                  key: DEPENDENCY_TRACK_ADMIN_PASSWORD
            {{- if eq (include "artifact-keeper.dtrackApiKeyFile" .) "true" }}
            # Where the script writes the key it extracts. Unset when
            # dependencyTrack.existingApiKeySecret supplies the key, which is
            # also when the volume below is not mounted.
            - name: DEPENDENCY_TRACK_API_KEY_FILE
              value: /shared/dtrack-api-key
            {{- end }}
          volumeMounts:
            - name: init-script
              mountPath: /scripts
              readOnly: true
            {{- if eq (include "artifact-keeper.dtrackApiKeyFile" .) "true" }}
            - name: shared-config
              mountPath: /shared
            {{- end }}
      volumes:
        - name: init-script
          configMap:
            name: {{ include "artifact-keeper.fullname" . }}-dtrack-init
            defaultMode: 0755
        {{- if eq (include "artifact-keeper.dtrackApiKeyFile" .) "true" }}
        - name: shared-config
          persistentVolumeClaim:
            claimName: {{ include "artifact-keeper.fullname" . }}-shared-config
        {{- end }}
{{- end }}
{{- end }}
