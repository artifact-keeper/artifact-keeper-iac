{{- if .Values.httpRoute.enabled }}
{{- include "artifact-keeper.httpRoute.validate" . }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "artifact-keeper.fullname" . }}
  labels:
    {{- $labels := include "artifact-keeper.labels" . | fromYaml }}
    {{- $_ := set $labels "app.kubernetes.io/component" "httproute" }}
    {{- toYaml (merge $labels .Values.httpRoute.labels) | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
  rules:
    {{- /* Eight matches per rule also supports the Gateway API v1.0 CRDs. */}}
    {{- range chunk 8 (include "artifact-keeper.backendPaths" . | fromYamlArray) }}
    - matches:
        {{- range . }}
        - path:
            type: {{ ternary "PathPrefix" "Exact" (eq .pathType "Prefix") }}
            value: {{ .path | quote }}
        {{- end }}
      backendRefs:
        - name: {{ include "artifact-keeper.fullname" $ }}-backend
          port: {{ $.Values.backend.service.httpPort }}
    {{- end }}
    {{- if .Values.httpRoute.dtrack.enabled }}
    - matches:
        - path:
            type: PathPrefix
            value: /dtrack
      backendRefs:
        - name: {{ include "artifact-keeper.fullname" . }}-dtrack
          port: 8080
    {{- end }}
    {{- if .Values.web.enabled }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "artifact-keeper.fullname" . }}-web
          port: {{ .Values.web.service.port }}
    {{- end }}
{{- end }}
