{{- if .Values.httpRoute.enabled }}
{{- include "artifact-keeper.httpRoute.validate" . }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "artifact-keeper.fullname" . }}
  labels:
    {{- $labels := include "artifact-keeper.labels" . | fromYaml }}
    {{- $_ := set $labels "app.kubernetes.io/component" "httproute" }}
    {{- toYaml (merge $labels .Values.httpRoute.labels) | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml .Values.httpRoute.hostnames | nindent 4 }}
  rules:
    {{- /* Timeouts apply only to the rules that reach the backend, where large
           artifact uploads and downloads run; the web and Dependency-Track
           rules keep the Gateway's default. */}}
    {{- $timeouts := include "artifact-keeper.httpRoute.timeouts" . | fromYaml }}
    {{- $backendRules := chunk 8 (include "artifact-keeper.backendPaths" . | fromYamlArray) }}
    {{- /* The HTTPRoute CRD allows at most 16 rules. */}}
    {{- $ruleCount := add (len $backendRules) (ternary 1 0 .Values.httpRoute.dtrack.enabled) (ternary 1 0 .Values.web.enabled) }}
    {{- if gt (int $ruleCount) 16 }}
    {{- fail (printf "HTTPRoute would need %d rules, more than the Gateway API limit of 16; shorten backend.extraFormatPaths" (int $ruleCount)) }}
    {{- end }}
    {{- /* Eight matches per rule also supports the Gateway API v1.0 CRDs. */}}
    {{- range $backendRules }}
    - matches:
        {{- range . }}
        - path:
            type: {{ ternary "PathPrefix" "Exact" (eq .pathType "Prefix") }}
            value: {{ .path | quote }}
        {{- end }}
      backendRefs:
        - name: {{ include "artifact-keeper.fullname" $ }}-backend
          port: {{ $.Values.backend.service.httpPort }}
      {{- with $timeouts }}
      timeouts:
        {{- if .request }}
        request: {{ .request | quote }}
        {{- end }}
        {{- if .backendRequest }}
        backendRequest: {{ .backendRequest | quote }}
        {{- end }}
      {{- end }}
    {{- end }}
    {{- if .Values.httpRoute.dtrack.enabled }}
    - matches:
        - path:
            type: PathPrefix
            value: /dtrack
      backendRefs:
        - name: {{ include "artifact-keeper.fullname" . }}-dtrack
          port: 8080
    {{- end }}
    {{- if .Values.web.enabled }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "artifact-keeper.fullname" . }}-web
          port: {{ .Values.web.service.port }}
    {{- end }}
{{- end }}
