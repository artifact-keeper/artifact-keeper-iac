{{/*
=============================================================================
EXAMPLE CONFIGURATION - Getting Started Template
=============================================================================
This file is provided as a starting point for deployments. It should be
reviewed and modified to match your specific infrastructure requirements,
security policies, and operational needs before use in production.
=============================================================================
*/}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "artifact-keeper.fullname" . }}-backend
  labels:
    {{- include "artifact-keeper.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "artifact-keeper.backend.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "artifact-keeper.web.selectorLabels" . | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "artifact-keeper.edge.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.backend.service.httpPort }}
          protocol: TCP
        - port: {{ .Values.backend.service.grpcPort }}
          protocol: TCP
    {{- if .Values.scannerAdapter.enabled }}
    # Scanner-adapter pulls target images from the backend registry endpoint
    - from:
        - podSelector:
            matchLabels:
              {{- include "artifact-keeper.scannerAdapter.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.backend.service.httpPort }}
          protocol: TCP
    {{- end }}
    {{- if .Values.imageBuilder.enabled }}
    # buildkitd pushes the images it builds back into this registry.
    - from:
        - podSelector:
            matchLabels:
              {{- include "artifact-keeper.imageBuilder.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.backend.service.httpPort }}
          protocol: TCP
    {{- end }}
    {{- /* Peers: networkPolicy.ingressPeers when set (e.g. the OpenShift
    router), else the ingress-nginx peer below. See the ingressPeers helper. */}}
    # Allow ingress controller. The namespace is pinned via
    # networkPolicy.ingressNamespace: an unrestricted namespaceSelector would
    # admit any pod carrying this label in ANY namespace, which on a shared
    # cluster is a cross-tenant path that bypasses the ingress entirely.
    - from:
        {{- include "artifact-keeper.networkPolicy.ingressPeers" . | trim | nindent 8 }}
      ports:
        - port: {{ .Values.backend.service.httpPort }}
          protocol: TCP
    # Allow Prometheus scraping, from networkPolicy.monitoringPeers or else
    # the networkPolicy.monitoringNamespace namespace. With the dedicated
    # metrics listener enabled the ServiceMonitor scrapes its port, so that
    # port is admitted too (#307).
    - from:
        {{- include "artifact-keeper.networkPolicy.monitoringPeers" . | trim | nindent 8 }}
      ports:
        - port: {{ .Values.backend.service.httpPort }}
          protocol: TCP
        {{- if .Values.backend.metricsListener.enabled }}
        - port: {{ .Values.backend.metricsListener.port }}
          protocol: TCP
        {{- end }}
  egress:
    # DNS resolution
    - ports:
        {{- include "artifact-keeper.networkPolicy.dnsPorts" . | trim | nindent 8 }}
    # PostgreSQL (in-cluster or external). Intentionally no destination
    # selector: the database may live outside this namespace (externalDatabase)
    # and a pod/namespace selector here would break those installs.
    - ports:
        - port: 5432
          protocol: TCP
    # OpenSearch
    - to:
        - podSelector:
            matchLabels:
              {{- include "artifact-keeper.opensearch.selectorLabels" . | nindent 14 }}
      ports:
        - port: 9200
          protocol: TCP
    # Trivy
    - to:
        - podSelector:
            matchLabels:
              {{- include "artifact-keeper.trivy.selectorLabels" . | nindent 14 }}
      ports:
        - port: 8090
          protocol: TCP
    {{- if .Values.scannerAdapter.enabled }}
    # Scanner-adapter (container-image Trivy scans)
    - to:
        - podSelector:
            matchLabels:
              {{- include "artifact-keeper.scannerAdapter.selectorLabels" . | nindent 14 }}
      ports:
        - port: 8090
          protocol: TCP
    {{- end }}
    {{- if .Values.imageBuilder.enabled }}
    # Image builder: the backend drives buildkitd over its gRPC port.
    - to:
        - podSelector:
            matchLabels:
              {{- include "artifact-keeper.imageBuilder.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.imageBuilder.service.port }}
          protocol: TCP
    {{- end }}
    # DependencyTrack
    - to:
        - podSelector:
            matchLabels:
              {{- include "artifact-keeper.dtrack.selectorLabels" . | nindent 14 }}
      ports:
        - port: 8080
          protocol: TCP
    # HTTPS (S3, external registries, OIDC providers). Deliberately
    # unrestricted on destination: the backend legitimately reaches arbitrary
    # external endpoints (object storage, OIDC/JWKS issuers, upstream
    # registries), and pinning destinations here would break those. Operators
    # wanting a stricter, namespace-scoped egress model should look at the
    # fleet guardrail policy (templates/fleet-networkpolicy.yaml), which
    # scopes egress to named shared-service namespaces plus DNS and 443.
    - ports:
        - port: 443
          protocol: TCP
---
# Web: accept traffic from ingress controller and Prometheus only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "artifact-keeper.fullname" . }}-web
  labels:
    {{- include "artifact-keeper.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "artifact-keeper.web.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Namespace pinned; see the note on the backend policy above.
    - from:
        {{- include "artifact-keeper.networkPolicy.ingressPeers" . | trim | nindent 8 }}
      ports:
        - port: {{ .Values.web.service.port }}
          protocol: TCP
    # Allow Prometheus scraping; see the backend policy.
    - from:
        {{- include "artifact-keeper.networkPolicy.monitoringPeers" . | trim | nindent 8 }}
      ports:
        - port: {{ .Values.web.service.port }}
          protocol: TCP
  egress:
    # DNS resolution
    - ports:
        {{- include "artifact-keeper.networkPolicy.dnsPorts" . | trim | nindent 8 }}
    # Backend API
    - to:
        - podSelector:
            matchLabels:
              {{- include "artifact-keeper.backend.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.backend.service.httpPort }}
          protocol: TCP
{{- if .Values.edge.enabled }}
---
# Edge: accept traffic from the ingress controller; reach the primary backend
# (pull-through cache) plus DNS/HTTPS for the case where PRIMARY_URL points at
# an external, TLS-terminating primary.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "artifact-keeper.fullname" . }}-edge
  labels:
    {{- include "artifact-keeper.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "artifact-keeper.edge.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Namespace pinned; see the note on the backend policy above.
    - from:
        {{- include "artifact-keeper.networkPolicy.ingressPeers" . | trim | nindent 8 }}
      ports:
        - port: {{ .Values.edge.service.port }}
          protocol: TCP
    # Allow Prometheus scraping; see the backend policy.
    - from:
        {{- include "artifact-keeper.networkPolicy.monitoringPeers" . | trim | nindent 8 }}
      ports:
        - port: {{ .Values.edge.service.port }}
          protocol: TCP
  egress:
    # DNS resolution
    - ports:
        {{- include "artifact-keeper.networkPolicy.dnsPorts" . | trim | nindent 8 }}
    # Primary backend (PRIMARY_URL)
    - to:
        - podSelector:
            matchLabels:
              {{- include "artifact-keeper.backend.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.backend.service.httpPort }}
          protocol: TCP
    # HTTPS (external primary or upstream registries)
    - ports:
        - port: 443
          protocol: TCP
{{- end }}
---
# Trivy: accept traffic from backend only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "artifact-keeper.fullname" . }}-trivy
  labels:
    {{- include "artifact-keeper.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "artifact-keeper.trivy.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "artifact-keeper.backend.selectorLabels" . | nindent 14 }}
      ports:
        - port: 8090
          protocol: TCP
  egress:
    # DNS resolution (for vuln DB updates)
    - ports:
        {{- include "artifact-keeper.networkPolicy.dnsPorts" . | trim | nindent 8 }}
    # HTTPS (download vulnerability databases)
    - ports:
        - port: 443
          protocol: TCP
{{- if .Values.scannerAdapter.enabled }}
---
# Scanner-adapter: accept scan requests from backend on 8090; reach the backend
# registry endpoint to pull target images, plus DNS/HTTPS for the vuln DB.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "artifact-keeper.fullname" . }}-scanner-adapter
  labels:
    {{- include "artifact-keeper.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "artifact-keeper.scannerAdapter.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "artifact-keeper.backend.selectorLabels" . | nindent 14 }}
      ports:
        - port: 8090
          protocol: TCP
  egress:
    # DNS resolution
    - ports:
        {{- include "artifact-keeper.networkPolicy.dnsPorts" . | trim | nindent 8 }}
    # Backend registry endpoint (pull target images to scan)
    - to:
        - podSelector:
            matchLabels:
              {{- include "artifact-keeper.backend.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.backend.service.httpPort }}
          protocol: TCP
    # HTTPS (Trivy vulnerability DB, external registries)
    - ports:
        - port: 443
          protocol: TCP
{{- end }}
---
# DependencyTrack: accept traffic from backend and dtrack-init Job
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "artifact-keeper.fullname" . }}-dtrack
  labels:
    {{- include "artifact-keeper.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "artifact-keeper.dtrack.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "artifact-keeper.backend.selectorLabels" . | nindent 14 }}
        # dtrack-init Job uses dtrack selector labels
        - podSelector:
            matchLabels:
              {{- include "artifact-keeper.dtrack.selectorLabels" . | nindent 14 }}
      ports:
        - port: 8080
          protocol: TCP
  egress:
    # DNS resolution
    - ports:
        {{- include "artifact-keeper.networkPolicy.dnsPorts" . | trim | nindent 8 }}
    # PostgreSQL
    - ports:
        - port: 5432
          protocol: TCP
    # HTTPS (NVD mirror, vulnerability data feeds)
    - ports:
        - port: 443
          protocol: TCP
---
# PostgreSQL: accept traffic from backend and DependencyTrack
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "artifact-keeper.fullname" . }}-postgres
  labels:
    {{- include "artifact-keeper.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "artifact-keeper.postgres.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "artifact-keeper.backend.selectorLabels" . | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "artifact-keeper.dtrack.selectorLabels" . | nindent 14 }}
      ports:
        - port: 5432
          protocol: TCP
{{- end }}
{{- /*
OpenSearch renders on its own switch as well as networkPolicy.enabled (#376).
The bundled OpenSearch has no authentication unless its Security plugin is
configured, so :9200 must not be reachable from arbitrary pods even when the
rest of the chart's policies are turned off. Only the backend (and
opensearch.networkPolicy.extraFrom) reaches the HTTP port, and only OpenSearch
pods reach the transport port.
*/}}
{{- if and .Values.opensearch.enabled (or .Values.networkPolicy.enabled .Values.opensearch.networkPolicy.enabled) }}
---
# OpenSearch: accept traffic from backend on 9200 and from peer OpenSearch
# pods on 9300 (transport for multi-node clustering).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "artifact-keeper.fullname" . }}-opensearch
  labels:
    {{- include "artifact-keeper.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "artifact-keeper.opensearch.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "artifact-keeper.backend.selectorLabels" . | nindent 14 }}
        {{- with .Values.opensearch.networkPolicy.extraFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: 9200
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              {{- include "artifact-keeper.opensearch.selectorLabels" . | nindent 14 }}
      ports:
        - port: 9300
          protocol: TCP
{{- end }}
