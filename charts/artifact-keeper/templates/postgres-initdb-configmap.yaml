{{- if and .Values.postgres.enabled .Values.postgres.initDb.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "artifact-keeper.fullname" . }}-init-db
  labels:
    {{- include "artifact-keeper.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
data:
  init-db.sql: |
    -- Create Dependency-Track database
    {{- $dtrackDb := include "artifact-keeper.dtrackDatabase" . }}
    {{- /* Postgres already creates postgres.auth.database, so a shared database would fail with "already exists". */}}
    {{- if ne $dtrackDb .Values.postgres.auth.database }}
    CREATE DATABASE {{ $dtrackDb }};
    GRANT ALL PRIVILEGES ON DATABASE {{ $dtrackDb }} TO {{ .Values.postgres.auth.username }};
    {{- end }}
{{- end }}
