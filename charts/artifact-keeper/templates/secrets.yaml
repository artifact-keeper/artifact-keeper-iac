{{/*
=============================================================================
EXAMPLE CONFIGURATION - Getting Started Template
=============================================================================
This file is provided as a starting point for deployments. It should be
reviewed and modified to match your specific infrastructure requirements,
security policies, and operational needs before use in production.
=============================================================================
*/}}
{{- if and (not .Values.externalSecrets.enabled) (not .Values.secrets.existingSecret) }}
{{ include "artifact-keeper.validateSecrets" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "artifact-keeper.secretName" . }}
  labels:
    {{- include "artifact-keeper.labels" . | nindent 4 }}
  {{- if include "artifact-keeper.generatedSecretNames" . }}
  annotations:
    # This Secret holds the only copy of a generated value, and the Postgres PVC
    # outlives the release. Helm leaves it in place on uninstall and on a failed
    # --atomic install, so the next install reads the same values back.
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
stringData:
  JWT_SECRET: {{ include "artifact-keeper.jwtSecret" . | quote }}
  {{- if .Values.postgres.enabled }}
  POSTGRES_PASSWORD: {{ include "artifact-keeper.postgresPassword" . | quote }}
  DATABASE_URL: {{ include "artifact-keeper.databaseUrl" . | quote }}
  {{- else if and (not (include "artifact-keeper.dedicatedDatabase" .)) (not .Values.externalDatabase.existingSecret) }}
  POSTGRES_PASSWORD: {{ .Values.externalDatabase.password | quote }}
  DATABASE_URL: {{ include "artifact-keeper.databaseUrl" . | quote }}
  {{- end }}
  {{- if .Values.secrets.s3AccessKey }}
  S3_ACCESS_KEY_ID: {{ .Values.secrets.s3AccessKey | quote }}
  {{- end }}
  {{- if .Values.secrets.s3SecretKey }}
  S3_SECRET_ACCESS_KEY: {{ .Values.secrets.s3SecretKey | quote }}
  {{- end }}
  {{- if and .Values.opensearch.enabled (not .Values.opensearch.disableSecurityPlugin) }}
  OPENSEARCH_USERNAME: {{ .Values.opensearch.auth.username | quote }}
  OPENSEARCH_PASSWORD: {{ .Values.opensearch.auth.password | quote }}
  {{- end }}
  {{- if .Values.dependencyTrack.enabled }}
  DEPENDENCY_TRACK_ADMIN_PASSWORD: {{ include "artifact-keeper.dtrackAdminPassword" . | quote }}
  {{- end }}
  {{- if .Values.secrets.smtpPassword }}
  SMTP_PASSWORD: {{ .Values.secrets.smtpPassword | quote }}
  {{- end }}
  {{- if .Values.secrets.migrationEncryptionKey }}
  MIGRATION_ENCRYPTION_KEY: {{ .Values.secrets.migrationEncryptionKey | quote }}
  {{- end }}
  {{- if .Values.secrets.webhookSecretKey }}
  AK_WEBHOOK_SECRET_KEY: {{ .Values.secrets.webhookSecretKey | quote }}
  {{- end }}
  {{- if .Values.secrets.ssoEncryptionKey }}
  SSO_ENCRYPTION_KEY: {{ .Values.secrets.ssoEncryptionKey | quote }}
  {{- end }}
{{- end }}
