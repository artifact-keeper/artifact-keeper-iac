# =============================================================================
# CloudNativePG PROFILE - dedicated database per service
# =============================================================================
# Layer this file on top of values.yaml:
#
#   helm install ak . -f values.yaml -f values-cnpg.yaml \
#     --set secrets.jwtSecret=$(openssl rand -base64 48)
#
# It expects two CloudNativePG Cluster resources in the release namespace,
# for example:
#
#   apiVersion: postgresql.cnpg.io/v1
#   kind: Cluster
#   metadata:
#     name: ak-backend-db
#   spec:
#     instances: 3
#     storage: { size: 20Gi }
#     bootstrap:
#       initdb:
#         database: artifact_registry
#         owner: registry
#   ---
#   apiVersion: postgresql.cnpg.io/v1
#   kind: Cluster
#   metadata:
#     name: ak-dtrack-db
#   spec:
#     instances: 3
#     storage: { size: 20Gi }
#     bootstrap:
#       initdb:
#         database: dependency_track
#         owner: dtrack
#
# The operator generates the `ak-backend-db-app` and `ak-dtrack-db-app`
# Secrets referenced below. The default key names match the CNPG
# application-secret layout.
#
# Clusters in another namespace: a pod can only read Secrets from its own
# namespace, so mirror both Secrets into the release namespace. CNPG's `uri` and
# `jdbc-uri` already name the host as `<cluster>-rw.<namespace>`, so they keep
# working from here. Remap to `fqdn-uri`/`fqdn-jdbc-uri` only if that short form
# does not resolve in your cluster. With networkPolicy.enabled the backend and
# Dependency-Track may reach port 5432 in any namespace; another port needs its
# own NetworkPolicy.
#
# Fleet mode: mutually exclusive with this profile, and the render fails if both
# are set. fleet.externalDatabaseBootstrap provisions one role and database per
# release on a single shared PostgreSQL server (backend only); this profile gives
# one install a dedicated cluster per service and relies on the CloudNativePG
# operator to provision.
#
# Airgap note: the wait-for-postgres init containers still run pg_isready from
# postgres.image (postgres:16-alpine by default) even though the in-cluster
# PostgreSQL itself is disabled here, so keep postgres.image on pre-pull lists.
# =============================================================================

# The shared in-cluster PostgreSQL is replaced by the two CNPG clusters.
postgres:
  enabled: false

# Opt out of the legacy externalDatabase default so the per-service
# dedicatedDatabase.existingSecret references below take effect.
externalDatabase:
  enabled: false

backend:
  dedicatedDatabase:
    existingSecret: ak-backend-db-app

dependencyTrack:
  dedicatedDatabase:
    existingSecret: ak-dtrack-db-app
