# Render-only CI variant: nothing else in the matrix enables scanWorker, so the
# worker, metrics Service and ServiceMonitor were never schema-validated.

# jwtSecret and the Postgres password are left unset, so the render takes the
# chart's generated-secret path like ci/test-values.yaml does
secrets:
  s3AccessKey: "ci-test-access"
  s3SecretKey: "ci-test-secret"

backend:
  env:
    STORAGE_BACKEND: "s3"
    S3_BUCKET: "ci-test-bucket"
    S3_REGION: "us-east-1"
  # Required for the worker's metrics Service and ServiceMonitor.
  metricsListener:
    enabled: true

serviceMonitor:
  enabled: true

scanWorker:
  enabled: true
  replicaCount: 2
