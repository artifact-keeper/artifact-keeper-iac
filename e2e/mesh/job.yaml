apiVersion: batch/v1
kind: Job
metadata:
  name: mesh-e2e-test
  namespace: ak-mesh-main
  labels:
    app.kubernetes.io/part-of: ak-mesh-test
    app.kubernetes.io/component: e2e-test
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: ak-mesh-test
        app.kubernetes.io/component: e2e-test
    spec:
      restartPolicy: Never
      # The job's ServiceAccount has no RBAC bindings; the token is useless to
      # the test and pure attack surface, so don't mount it.
      automountServiceAccountToken: false
      containers:
        - name: mesh-e2e
          image: alpine:3.20
          # The container still runs as root (the Alpine image ships no
          # non-root user and the runtime `apk add` below needs root to write
          # the package database), so runAsNonRoot is not possible here. What
          # we CAN do is drop every capability and forbid privilege
          # escalation; verified against alpine:3.20 that
          # `apk add --no-cache curl jq` works with all capabilities dropped.
          # NOTE: the runtime `apk add` requires egress to the Alpine CDN
          # (dl-cdn.alpinelinux.org); any NetworkPolicy on ak-mesh-main must
          # allow TCP/443 out.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command: ["/bin/sh", "-c"]
          args: ["apk add --no-cache curl jq && /scripts/mesh-e2e-test.sh"]
          env:
            - name: MAIN_URL
              value: "http://ak-main-backend.ak-mesh-main.svc.cluster.local:8080"
            - name: PEER1_URL
              value: "http://ak-peer1-backend.ak-mesh-peer1.svc.cluster.local:8080"
            - name: PEER2_URL
              value: "http://ak-peer2-backend.ak-mesh-peer2.svc.cluster.local:8080"
            - name: PEER3_URL
              value: "http://ak-peer3-backend.ak-mesh-peer3.svc.cluster.local:8080"
            - name: ADMIN_PASSWORD
              value: "admin"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: test-scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: test-scripts
          configMap:
            name: mesh-e2e-test-scripts
            defaultMode: 0755
